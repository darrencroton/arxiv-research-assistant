[output]
root = "output"
summaries_dir = "summaries"
daily_notes_dir = "daily-notes"
weekly_notes_dir = "weekly-notes"
pdfs_dir = "pdfs"

[state]
root = "state"
papers_dir = "papers"
runs_dir = "runs"

[logs]
root = "logs"
history_file = "history.log"
last_run_file = "last-run.log"

[templates]
daily_template = "user_preferences/templates/daily-note-template.md"
weekly_template = "user_preferences/templates/weekly-note-template.md"

[preferences]
file = "user_preferences/preferences.md"

[notes]
link_style = "wikilink"
weekly_note_file = "this-weeks-arxiv-papers.md"
rotation_day = "monday"
shift_announcements_to_next_weekday = true
archive_name_pattern = "{date}-weekly-arxiv.md"
daily_top_paper_heading = "## TODAY'S TOP PAPER"
weekly_synthesis_heading = "## SYNTHESIS"
weekly_additions_heading = "## DAILY ADDITIONS"
weekly_synthesis_word_limit_start = 100
weekly_synthesis_word_limit_end = 200
weekly_synthesis_max_tokens = 4096  # effective cap is min(this, [llm].max_output_tokens)

[arxiv]
max_summarized_papers = 3
min_summarize_score = 90
min_selection_score = 70
page_size = 100

[llm]
mode = "cli"
provider = "claude"
model = ""
effort = "high"
timeout_seconds = 1200
max_output_tokens = 32768
max_prompt_chars = 300000
temperature = 0.2
retry_attempts = 3
base_url = ""
api_key_env = ""
env_file = ""
download_timeout_seconds = 120
max_pdf_size_mb = 100
marker_timeout_seconds = 300
ranking_batch_size = 0  # 0 = no batching; set to e.g. 25 for local models that truncate large outputs

# Optional: override specific fields for ranking only.
# Any field omitted here falls back to [llm]. Only specify what differs.
# [llm-ranking]
# provider = "openai-compatible"
# model = "minimax/minimax-m2.7-q8"
# base_url = "http://127.0.0.1:1234/v1"

# Optional: override specific fields for paper summarisation only.
# [llm-summary]
# mode = "api"
# provider = "claude"
# model = "claude-opus-4-7"
